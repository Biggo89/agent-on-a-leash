[project]
name = "leash"
version = "0.1.0"
description = "Wallet Control Layer — Agent on a Leash (Viseca, Swiss {ai} Weeks 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
# Silence exactly two third-party warnings, both emitted when starlette's TestClient is
# imported and neither fixable in our source. Kept narrow on purpose: any OTHER warning —
# especially one from our own code — must still be visible in `make check`.
#   1. starlette 1.6 prefers httpx2 over httpx for its test client.
#   2. starlette's own use of the deprecated anyio.abc.BlockingPortal alias.
# Re-check these after any fastapi/starlette upgrade; if they stop matching, pytest will
# simply show the warning again rather than failing.
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
# CSS, HTML and JavaScript as Python strings: the line length that reads well is theirs.
"payment_app/ui.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
[[tool.mypy.overrides]]
module = ["tests.*", "sandbox.*", "payment_app.*", "tools.*"]
strict = false
