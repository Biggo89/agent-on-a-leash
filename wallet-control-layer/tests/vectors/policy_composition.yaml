# Language-neutral vectors for policy-layer composition.
# Spec: specs/customer-settings.md §3
#
# Three layers — account, standing preferences, the per-errand mandate — compose
# tightest-wins. Every merge below narrows, which is what makes invariant I1 ("layering never
# loosens") true by construction rather than by inspection.
#
# One exclusion is load-bearing, and one was lifted — both have cases at the end:
#   * `item_identity` / `item_attribute` describe the errand, not the customer (§3.2)
#   * period rules used to be mandate-only, because the shortest window displaced the others
#     and layering one could DELETE the ceiling it was meant to reinforce. Multi-window
#     enrichment enforces every stated window, so they compose like any other rule (§3.4)
suite: policy_composition
cases:
  # ----------------------------------------------------------------- money

  - name: a mandate alone composes to itself
    layers:
      - source: mandate
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 400, scope: purchase}]
    expect_purchase_cap: 400.0
    expect_uncertainty_policy: ask

  - name: a tighter standing preference binds over the mandate
    layers:
      - source: preferences
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 300, scope: purchase}]
      - source: mandate
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 400, scope: purchase}]
    expect_purchase_cap: 300.0
    expect_cap_source: preferences

  - name: a looser standing preference never widens the mandate
    note: I1 — the whole reason layering is safe without a new consent moment.
    layers:
      - source: preferences
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 5000, scope: purchase}]
      - source: mandate
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 400, scope: purchase}]
    expect_purchase_cap: 400.0
    expect_cap_source: instruction

  - name: the account ceiling binds when it is the tightest of the three
    layers:
      - source: account
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 100, scope: purchase}]
      - source: preferences
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 300, scope: purchase}]
      - source: mandate
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 400, scope: purchase}]
    expect_purchase_cap: 100.0
    expect_cap_source: account

  - name: layer order does not change the answer
    note: Every merge is commutative; order decides provenance order and nothing else.
    layers:
      - source: mandate
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 400, scope: purchase}]
      - source: preferences
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 300, scope: purchase}]
    expect_purchase_cap: 300.0

  # ----------------------------------------------------------------- uncertainty

  - name: uncertainty takes the strictest layer
    layers:
      - source: preferences
        uncertainty_policy: decline
      - source: mandate
        uncertainty_policy: ask
    expect_uncertainty_policy: decline

  - name: a looser uncertainty policy in a layer is ignored
    layers:
      - source: preferences
        uncertainty_policy: approve
      - source: mandate
        uncertainty_policy: ask
    expect_uncertainty_policy: ask

  - name: no layer states one, so the default stands
    note: '`ask` is the middle of approve -> ask -> decline. specs/policy-ir.md rule 6.'
    layers:
      - source: mandate
    expect_uncertainty_policy: ask

  # ----------------------------------------------------------------- facets

  - name: one kind merges into one facet, never two
    note: policy.facet() reads the FIRST of a kind, so a second would be silently inert.
    layers:
      - source: preferences
        intent_facets: [{kind: merchant_familiarity, require: {prior_approvals_min: 3}}]
      - source: mandate
        intent_facets: [{kind: merchant_familiarity, require: {prior_approvals_min: 1}}]
    expect_facet_count: 1
    expect_requirement: {kind: merchant_familiarity, key: prior_approvals_min, value: 3}

  - name: a higher return-window bar wins
    layers:
      - source: preferences
        intent_facets: [{kind: order_terms, require: {return_window_days_min: 30}}]
      - source: mandate
        intent_facets: [{kind: order_terms, require: {return_window_days_min: 14}}]
    expect_requirement: {kind: order_terms, key: return_window_days_min, value: 30}

  - name: permitted shop categories intersect
    layers:
      - source: preferences
        intent_facets: [{kind: merchant_type, require: {merchant_category_in: [groceries, household]}}]
      - source: mandate
        intent_facets: [{kind: merchant_type, require: {merchant_category_in: [groceries, dining]}}]
    expect_requirement: {kind: merchant_type, key: merchant_category_in, value: [groceries]}

  - name: an empty intersection is a conflict, not a policy
    note: >
      An empty allow-list reaches check_merchant_type as UNKNOWN, routes through
      uncertainty_policy and turns every order into a step-up the customer cannot connect to
      the preference they just saved. Returned as a conflict so the caller refuses the edit.
    layers:
      - source: preferences
        intent_facets: [{kind: merchant_type, require: {merchant_category_in: [groceries]}}]
      - source: mandate
        intent_facets: [{kind: merchant_type, require: {merchant_category_in: [sporting_goods]}}]
    expect_conflicts: [merchant_type]

  - name: no_additions is contributed by presence alone
    layers:
      - source: preferences
        intent_facets: [{kind: no_additions}]
      - source: mandate
    expect_has_facet: no_additions

  - name: a facet only one layer states is carried through untouched
    layers:
      - source: preferences
      - source: mandate
        intent_facets: [{kind: merchant_type, require: {merchant_category_in: [electronics]}}]
    expect_requirement: {kind: merchant_type, key: merchant_category_in, value: [electronics]}

  # ------------------------------------------------- period windows, and the one exclusion

  - name: a period rule from a standing layer composes beside the mandate's
    note: >
      Layerable since multi-window enrichment (decision-rules.md §9). Both survive and both
      are enforced: a standing monthly ceiling and an errand's weekly one are two constraints,
      not a contest one of them loses. While the shortest window displaced the rest, adding
      CHF 500/7d beside CHF 1000/30d deleted the monthly ceiling — specs/customer-settings.md
      §3.4 has the measured counter-example.
    layers:
      - source: preferences
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 1000, scope: period, period_days: 30}]
      - source: mandate
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 300, scope: period, period_days: 7}]
    expect_period_windows: [7, 30]

  - name: one period rule composes to one window
    layers:
      - source: mandate
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 300, scope: period, period_days: 7}]
    expect_period_windows: [7]

  - name: two layers naming the same window take the tighter cap
    layers:
      - source: preferences
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 200, scope: period, period_days: 7}]
      - source: mandate
        hard_rules: [{field: billing_amount_chf, operator: "<=", value: 300, scope: period, period_days: 7}]
    expect_period_windows: [7]
    expect_period_cap_for: {days: 7, value: 200.0}

  - name: an item attribute from a standing layer is refused
    note: '"size 43" describes this errand''s object, not the customer. §3.2'
    layers:
      - source: preferences
        intent_facets: [{kind: item_attribute, require: {size: 43}}]
      - source: mandate
    expect_missing_facet: item_attribute
    expect_note_contains: setting_not_standing

  - name: the same attribute on the mandate is kept
    layers:
      - source: mandate
        intent_facets: [{kind: item_attribute, require: {size: 43}}]
    expect_requirement: {kind: item_attribute, key: size, value: 43}
